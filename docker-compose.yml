services:

  registry:
    build:
      context: ./ms-registry
      dockerfile: Dockerfile
    container_name: registry
    ports:
      - "8761:8761"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URI}
    networks:
      - elecciones-network

  configserver:
    build:
      context: ./ms-config-server
      dockerfile: Dockerfile
    container_name: configserver
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: ${CONFIG_SERVER_URI}
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: ${CONFIG_SERVER_BRANCH}
    depends_on:
      registry:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8888'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    networks:
      - elecciones-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    networks:
      - elecciones-network

  securityservice:
    build:
      context: ./ms-securityservice
      dockerfile: Dockerfile
    container_name: securityservice
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    depends_on:
      registry:
        condition: service_started
      configserver:
        condition: service_healthy
    networks:
      - elecciones-network

  gateway:
    build:
      context: ./ms-gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      registry:
        condition: service_started
      configserver:
        condition: service_healthy
      securityservice:
        condition: service_started
    networks:
      - elecciones-network

  patron:
    build:
      context: ./ms-patron
      dockerfile: Dockerfile
    container_name: patron
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      registry:
        condition: service_started
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - elecciones-network

  votacion:
    build:
      context: ./ms-votacion
      dockerfile: Dockerfile
    container_name: votacion
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      registry:
        condition: service_started
      configserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      patron:
        condition: service_started
    networks:
      - elecciones-network

networks:
  elecciones-network:
    driver: bridge
