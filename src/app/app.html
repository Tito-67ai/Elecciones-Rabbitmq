<router-outlet />

<div class="toasts">
  @for (notificacion of notificaciones.notificaciones(); track notificacion.id) {
    <div
      class="toast"
      [class.ok]="notificacion.tipo === 'ok'"
      [class.error]="notificacion.tipo === 'error'"
      role="status"
    >
      <span>{{ notificacion.mensaje }}</span>
      <button type="button" (click)="notificaciones.cerrar(notificacion.id)" aria-label="Cerrar">✕</button>
    </div>
  }
</div>
